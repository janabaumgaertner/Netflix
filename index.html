<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Access</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.90)),
url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1600');
background-size:cover;
background-position:center;
overflow:hidden;
animation:zoomBg 20s ease-in-out infinite alternate;
}

@keyframes zoomBg{
from{
background-size:100%;
}
to{
background-size:110%;
}
}

.card{
width:92%;
max-width:650px;
background:rgba(10,10,10,.88);
backdrop-filter:blur(15px);
padding:45px;
border-radius:28px;
text-align:center;
border:1px solid rgba(255,255,255,.08);

box-shadow:
0 0 30px rgba(229,9,20,.25),
0 0 60px rgba(229,9,20,.15),
0 20px 80px rgba(0,0,0,.75);

animation:cardFloat 4s ease-in-out infinite;
}

@keyframes cardFloat{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-6px);
}
}

.logo{
font-size:48px;
font-weight:900;
color:#e50914;
letter-spacing:2px;
margin-bottom:12px;

text-shadow:
0 0 15px rgba(229,9,20,.7),
0 0 35px rgba(229,9,20,.4);
}

.badge{
display:inline-block;
padding:8px 16px;
background:rgba(229,9,20,.15);
border:1px solid rgba(229,9,20,.4);
color:#ffb3b3;
border-radius:50px;
font-size:13px;
margin-bottom:20px;
}

h1{
color:white;
font-size:38px;
margin-bottom:15px;
}

.desc{
color:#d8d8d8;
line-height:1.8;
font-size:17px;
margin-bottom:25px;
}

.progress-container{
height:12px;
background:#2b2b2b;
border-radius:50px;
overflow:hidden;
margin-bottom:15px;
}

.progress{
height:100%;
width:85%;
background:linear-gradient(90deg,#b20710,#e50914,#ff2e38);
background-size:300% 300%;
animation:progressMove 3s linear infinite;
}

@keyframes progressMove{
0%{
background-position:0% 50%;
}
100%{
background-position:100% 50%;
}
}

.status{
color:#bfbfbf;
font-size:14px;
margin-bottom:20px;
}

.stats{
display:flex;
justify-content:space-around;
margin:25px 0;
padding:15px 0;
border-top:1px solid rgba(255,255,255,.08);
border-bottom:1px solid rgba(255,255,255,.08);
}

.stats div{
color:white;
font-size:14px;
}

.stats strong{
display:block;
font-size:22px;
color:#e50914;
margin-bottom:5px;
}

.verify{
display:flex;
justify-content:center;
align-items:center;
gap:18px;
margin:30px 0;
color:white;
font-size:28px;
font-weight:700;
}

.verify input{
width:38px;
height:38px;
cursor:pointer;
animation:checkboxPulse 1.6s infinite;
}

@keyframes checkboxPulse{
0%{
transform:scale(1);
}
50%{
transform:scale(1.15);
}
100%{
transform:scale(1);
}
}

button{
width:100%;
padding:18px;
border:none;
border-radius:14px;
background:#e50914;
color:white;
font-size:22px;
font-weight:800;
cursor:pointer;
transition:.25s;
opacity:.55;

animation:glowBtn 2s infinite;
}

@keyframes glowBtn{
0%{
box-shadow:0 0 10px rgba(229,9,20,.3);
}
50%{
box-shadow:0 0 35px rgba(229,9,20,.8);
}
100%{
box-shadow:0 0 10px rgba(229,9,20,.3);
}
}

button:hover{
transform:translateY(-3px);
}

button:disabled{
cursor:not-allowed;
}

.footer{
margin-top:22px;
font-size:13px;
color:#9f9f9f;
}

@media(max-width:600px){

.card{
padding:30px;
}

.logo{
font-size:36px;
}

h1{
font-size:28px;
}

.verify{
font-size:22px;
}

.verify input{
width:34px;
height:34px;
}

.stats strong{
font-size:18px;
}

}
</style>

</head>

<body>

<div class="card">

<div class="logo">MOVIE ACCESS</div>

<div class="badge">
✓ VERIFIED CONTENT PORTAL
</div>

<h1>Unlock Trending Movie Content</h1>

<p class="desc">
Trending movie content and fan-favorite updates are available. Complete the verification step below to continue.
</p>

<div class="progress-container">
<div class="progress"></div>
</div>

<div class="status">
Access Verification: 85%
</div>

<div class="stats">
<div>
<strong>1.2M+</strong>
Fans
</div>

<div>
<strong>24K+</strong>
Online
</div>

<div>
<strong>98%</strong>
Verified
</div>
</div>

<div class="verify">
<input type="checkbox" id="verify">
<label for="verify">I am not a robot</label>
</div>

<button id="continueBtn" disabled>
Continue Access
</button>

<div class="footer">
Secure Verification • Fast Access • Mobile Friendly
</div>

</div>

<script>

const verify = document.getElementById("verify");
const btn = document.getElementById("continueBtn");

verify.addEventListener("change",()=>{

if(verify.checked){
btn.disabled=false;
btn.style.opacity="1";
}else{
btn.disabled=true;
btn.style.opacity=".55";
}

});

btn.addEventListener("click",()=>{

btn.innerHTML="Preparing Access...";
btn.disabled=true;

setTimeout(()=>{

window.location.href="YOUR_LINK_HERE";

},1500);

});

</script>

</body>
</html>
