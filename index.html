<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exclusive Access</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.88)),
url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1600');
background-size:cover;
background-position:center;
overflow:hidden;
}

.card{
width:90%;
max-width:580px;
background:rgba(12,12,12,.88);
backdrop-filter:blur(12px);
padding:45px;
border-radius:24px;
text-align:center;
border:1px solid rgba(255,255,255,.08);

box-shadow:
0 20px 60px rgba(0,0,0,.6),
0 0 40px rgba(229,9,20,.15);

animation:cardFloat 4s ease-in-out infinite;
}

@keyframes cardFloat{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-6px);
}
}

.logo{
font-size:42px;
font-weight:900;
color:#e50914;
letter-spacing:1px;
margin-bottom:12px;

text-shadow:
0 0 10px rgba(229,9,20,.4),
0 0 25px rgba(229,9,20,.3);
}

.badge{
display:inline-block;
padding:8px 14px;
background:rgba(229,9,20,.15);
border:1px solid rgba(229,9,20,.4);
color:#ffb3b3;
border-radius:50px;
font-size:13px;
margin-bottom:18px;
}

h1{
color:white;
font-size:34px;
margin-bottom:12px;
}

.desc{
color:#d6d6d6;
line-height:1.8;
font-size:17px;
margin-bottom:28px;
}

.progress-container{
height:12px;
background:#2b2b2b;
border-radius:50px;
overflow:hidden;
margin-bottom:14px;
}

.progress{
height:100%;
width:85%;
background:linear-gradient(90deg,#b20710,#e50914,#ff2e38);
background-size:300% 300%;
animation:progressMove 3s linear infinite;
}

@keyframes progressMove{
0%{
background-position:0% 50%;
}
100%{
background-position:100% 50%;
}
}

.status{
color:#bfbfbf;
font-size:14px;
margin-bottom:28px;
}

.verify{
display:flex;
justify-content:center;
align-items:center;
gap:16px;
margin-bottom:30px;
color:white;
font-size:24px;
font-weight:700;
}

.verify input{
width:34px;
height:34px;
cursor:pointer;
animation:checkboxPulse 1.8s infinite;
}

@keyframes checkboxPulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.12);
}

100%{
transform:scale(1);
}

}

button{
width:100%;
padding:18px;
border:none;
border-radius:14px;
background:#e50914;
color:white;
font-size:20px;
font-weight:800;
cursor:pointer;
transition:.25s;
opacity:.55;

box-shadow:
0 0 20px rgba(229,9,20,.3);
}

button:hover{
transform:translateY(-3px);
box-shadow:
0 0 35px rgba(229,9,20,.5);
}

button:disabled{
cursor:not-allowed;
}

.footer{
margin-top:24px;
font-size:13px;
color:#9f9f9f;
}

@media(max-width:600px){

.card{
padding:30px;
}

.logo{
font-size:34px;
}

h1{
font-size:28px;
}

.verify{
font-size:20px;
}

.verify input{
width:30px;
height:30px;
}

}

</style>

</head>
<body>

<div class="card">

<div class="logo">MOVIE ACCESS</div>

<div class="badge">
✓ VERIFIED CONTENT PORTAL
</div>

<h1>Exclusive Content Available</h1>

<p class="desc">
Trending movie content and fan favorites are ready to access.
Complete verification to continue.
</p>

<div class="progress-container">
<div class="progress"></div>
</div>

<div class="status">
Verification Progress: 85%
</div>

<div class="verify">
<input type="checkbox" id="verify">
<label for="verify">I am not a robot</label>
</div>

<button id="continueBtn" disabled>
Continue Access
</button>

<div class="footer">
Secure Verification • Fast Access • Mobile Friendly
</div>

</div>

<script>

const verify = document.getElementById("verify");
const btn = document.getElementById("continueBtn");

verify.addEventListener("change",()=>{

if(verify.checked){

btn.disabled=false;
btn.style.opacity="1";

}else{

btn.disabled=true;
btn.style.opacity=".55";

}

});

btn.addEventListener("click",()=>{

btn.innerHTML="Preparing Access...";
btn.disabled=true;

setTimeout(()=>{

window.location.href="https://settleddough.com/h615h6ng?key=31224f6ad9eb2b1aeb55ef7bcd89a6ca";

},1500);

});

</script>

</body>
</html>
